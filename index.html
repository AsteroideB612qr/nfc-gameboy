<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #diagnostico {

            position: fixed;

            left: 5px;
            right: 5px;
            bottom: 5px;

            z-index: 999999;

            background: rgba(0,0,0,.90);

            color: #00ff66;

            padding: 10px;

            font-family: monospace;

            font-size: 11px;

            max-height: 35vh;

            overflow: auto;

        }

    </style>

</head>


<body>

<div id="game"></div>

<div id="diagnostico">
    Iniciando...
</div>


<script>

const D =
    document.getElementById("diagnostico");


function log(texto) {

    D.innerHTML +=
        "<br>" + texto;

    console.log(texto);

}


// ==========================================
// EMULATORJS
// ==========================================

window.EJS_player = "#game";

window.EJS_core = "gb";

window.EJS_gameUrl = "games/test.gb";

window.EJS_gameName =
    "NFC Game Boy";

window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";

window.EJS_startOnLoaded = true;


// ==========================================
// CUANDO EJS ESTÉ LISTO
// ==========================================

window.EJS_ready = function () {

    log("EJS READY");

    buscarMenu();

};


// ==========================================
// BUSCAR ELEMENTOS DEL MENÚ
// ==========================================

function buscarMenu() {

    log("Buscando elementos...");


    setTimeout(function () {

        const elementos =
            document.querySelectorAll("*");


        let encontrados = 0;


        elementos.forEach(function (elemento) {

            const texto =
                (elemento.innerText || "")
                .trim();


            if (
                texto === "Pausa" ||
                texto === "Reanudar" ||
                texto === "II Pausa" ||
                texto.includes("Pausa")
            ) {

                encontrados++;

                log(
                    "ENCONTRADO: " +
                    elemento.tagName +
                    " / " +
                    texto
                );

            }

        });


        log(
            "Total encontrados: " +
            encontrados
        );


    }, 2000);

}

</script>


<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>


</body>

</html>

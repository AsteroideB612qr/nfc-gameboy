<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            overflow: hidden;

        }

        #game {

            width: 100%;
            height: 100%;

        }

        #diagnostico {

            position: fixed;

            left: 5px;
            right: 5px;
            bottom: 5px;

            z-index: 999999;

            background: rgba(0,0,0,.92);

            color: #00ff66;

            padding: 10px;

            font-family: monospace;

            font-size: 11px;

            max-height: 40vh;

            overflow: auto;

        }

    </style>

</head>


<body>


<div id="game"></div>


<div id="diagnostico">
    Iniciando...
</div>


<script>

const D =
    document.getElementById(
        "diagnostico"
    );


function log(texto) {

    D.innerHTML +=
        "<br>" + texto;

    console.log(texto);

}


// ==========================================
// CONFIGURACIÓN EMULATORJS
// ==========================================

window.EJS_player =
    "#game";

window.EJS_core =
    "gb";

window.EJS_gameUrl =
    "games/Pokemon_Red.gb";

window.EJS_gameName =
    "NFC Game Boy";

window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";

window.EJS_startOnLoaded =
    true;


// ==========================================
// EJS READY
// ==========================================

window.EJS_ready = function () {

    log("EJS listo");

    esperarGameManager();

};


// ==========================================
// ESPERAR GAME MANAGER
// ==========================================

function esperarGameManager() {

    if (
        window.EJS_emulator &&
        window.EJS_emulator.gameManager
    ) {

        log(
            "✓ gameManager encontrado"
        );

        analizarLoop();

        return;

    }


    log(
        "Esperando gameManager..."
    );


    setTimeout(
        esperarGameManager,
        250
    );

}


// ==========================================
// ANALIZAR MAIN LOOP
// ==========================================

function analizarLoop() {

    const manager =
        window.EJS_emulator.gameManager;


    log(
        "Analizando main loop..."
    );


    // --------------------------------------
    // COMPROBAR PROPIEDADES
    // --------------------------------------

    const propiedades =
        Object.keys(manager);


    log(
        "Propiedades propias:"
    );


    if (
        propiedades.length === 0
    ) {

        log(
            "(ninguna)"
        );

    }
    else {

        log(
            propiedades.join(", ")
        );

    }


    // --------------------------------------
    // BUSCAR VARIABLES RELACIONADAS
    // --------------------------------------

    const todas =
        propiedades.filter(
            function (nombre) {

                return (
                    nombre
                        .toLowerCase()
                        .includes("loop") ||
                    nombre
                        .toLowerCase()
                        .includes("run") ||
                    nombre
                        .toLowerCase()
                        .includes("pause") ||
                    nombre
                        .toLowerCase()
                        .includes("start")
                );

            }
        );


    log(
        "Variables loop/run:"
    );


    log(
        todas.join(", ")
    );


    // --------------------------------------
    // INTENTAR TOGGLE
    // --------------------------------------

    if (
        typeof manager.toggleMainLoop ===
        "function"
    ) {

        log(
            "✓ toggleMainLoop existe"
        );


        setTimeout(
            function () {

                log(
                    "Ejecutando toggleMainLoop()..."
                );


                try {

                    manager.toggleMainLoop();


                    log(
                        "✓ toggleMainLoop ejecutado"
                    );

                    log(
                        "Observa la pantalla..."
                    );

                }

                catch (error) {

                    log(
                        "❌ Error: " +
                        error
                    );

                }

            },
            500
        );

    }

    else {

        log(
            "❌ toggleMainLoop no existe"
        );

    }

}

</script>


<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NFC Game Boy</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="game"></div>

<script>

    // ==========================================
    // CONFIGURACIÓN EMULATORJS
    // ==========================================

    EJS_player = "#game";

    EJS_core = "gb";

    EJS_gameUrl = "games/Pokemon_Red.gb";

    EJS_gameName = "NFC Game Boy";

    EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    // Inicio automático
    EJS_startOnLoaded = true;

</script>

<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>

</body>
</html>

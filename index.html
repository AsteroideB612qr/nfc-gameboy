<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #diagnostico {

            position: fixed;

            left: 5px;
            right: 5px;
            bottom: 5px;

            z-index: 999999;

            background: rgba(0, 0, 0, 0.92);

            color: #00ff66;

            padding: 10px;

            font-family: monospace;

            font-size: 11px;

            max-height: 40vh;

            overflow: auto;
        }

    </style>

</head>


<body>

<div id="game"></div>

<div id="diagnostico">
    Iniciando...
</div>


<script>

const D =
    document.getElementById(
        "diagnostico"
    );


function log(texto) {

    D.innerHTML +=
        "<br>" + texto;

    console.log(texto);

}


// ==========================================
// CONFIGURACIÓN
// ==========================================

window.EJS_player =
    "#game";

window.EJS_core =
    "gb";

window.EJS_gameUrl =
    "games/Pokemon_Red.gb";

window.EJS_gameName =
    "NFC Game Boy";

window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";

window.EJS_startOnLoaded =
    true;


// ==========================================
// EJS READY
// ==========================================

window.EJS_ready = function () {

    log("EJS listo");

    esperarGameManager();

};


// ==========================================
// ESPERAR GAME MANAGER REAL
// ==========================================

function esperarGameManager() {

    const emulator =
        window.EJS_emulator;


    const manager =
        emulator &&
        emulator.gameManager;


    if (!manager) {

        log(
            "Esperando gameManager..."
        );

        setTimeout(
            esperarGameManager,
            200
        );

        return;
    }


    log(
        "✓ gameManager encontrado"
    );


    // Mostrar los métodos disponibles

    const metodos =
        Object.keys(manager)
            .filter(function (key) {

                return typeof
                    manager[key] ===
                    "function";

            });


    log(
        "Métodos propios:"
    );


    log(
        metodos.join(", ")
    );


    // También revisar prototype

    let proto =
        Object.getPrototypeOf(
            manager
        );


    if (proto) {

        const protoMetodos =
            Object.getOwnPropertyNames(
                proto
            );


        log(
            "Métodos prototype:"
        );


        log(
            protoMetodos.join(", ")
        );

    }


    // ======================================
    // BUSCAR RESTART
    // ======================================

    if (
        typeof manager.restart ===
        "function"
    ) {

        log(
            "✓ manager.restart EXISTE"
        );


        setTimeout(
            function () {

                log(
                    "Ejecutando manager.restart()..."
                );


                try {

                    manager.restart();


                    log(
                        "✓ restart ejecutado"
                    );

                }

                catch (error) {

                    log(
                        "❌ Error restart: " +
                        error
                    );

                }

            },
            500
        );

    }

    else {

        log(
            "❌ manager.restart NO EXISTE"
        );

    }

}

</script>


<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>


</body>

</html>

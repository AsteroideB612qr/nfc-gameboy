<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            overflow: hidden;
        }

        #game {

            width: 100%;
            height: 100%;
        }

        #diagnostico {

            position: fixed;

            left: 5px;
            right: 5px;
            bottom: 5px;

            z-index: 999999;

            background: rgba(0, 0, 0, 0.9);

            color: #00ff66;

            padding: 10px;

            font-family: monospace;

            font-size: 11px;

            max-height: 35vh;

            overflow: auto;
        }

    </style>

</head>


<body>


<div id="game"></div>


<div id="diagnostico">

    Preparando...

</div>


<script>

const D =
    document.getElementById(
        "diagnostico"
    );


function log(texto) {

    D.innerHTML +=
        "<br>" + texto;

    console.log(texto);

}


// ==========================================
// CONFIGURACIÓN EMULATORJS
// ==========================================

window.EJS_player =
    "#game";

window.EJS_core =
    "gb";

window.EJS_gameUrl =
    "games/Pokemon_Red.gb";

window.EJS_gameName =
    "NFC Game Boy";

window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";

window.EJS_startOnLoaded =
    true;


// ==========================================
// EJS READY
// ==========================================

window.EJS_ready = function () {

    log(
        "EJS listo"
    );

    iniciarDespertar();

};


// ==========================================
// BUSCAR BOTÓN
// ==========================================

function buscarBoton(texto) {

    const botones =
        document.querySelectorAll(
            "button"
        );


    for (
        let i = 0;
        i < botones.length;
        i++
    ) {

        const boton =
            botones[i];


        const contenido =
            (
                boton.innerText ||
                ""
            ).trim();


        if (
            contenido === texto
        ) {

            return boton;

        }

    }


    return null;

}


// ==========================================
// PAUSA → REANUDAR
// ==========================================

function iniciarDespertar() {

    log(
        "Esperando 2 segundos..."
    );


    setTimeout(function () {

        log(
            "Buscando botón Pausar..."
        );


        const botonPausa =
            buscarBoton(
                "Pausar"
            );


        if (!botonPausa) {

            log(
                "❌ No encontré Pausar"
            );

            return;
        }


        log(
            "✓ Encontré Pausar"
        );


        // ==================================
        // HACER CLICK
        // ==================================

        botonPausa.click();


        log(
            "✓ Pausar ejecutado"
        );


        // ==================================
        // ESPERAR
        // ==================================

        setTimeout(function () {

            log(
                "Buscando Reanudar..."
            );


            const botonReanudar =
                buscarBoton(
                    "Reanudar"
                );


            if (
                !botonReanudar
            ) {

                log(
                    "❌ No encontré Reanudar"
                );

                return;
            }


            log(
                "✓ Encontré Reanudar"
            );


            botonReanudar.click();


            log(
                "✓ REANUDAR EJECUTADO"
            );


            log(
                "🎮 Ahora debería iniciar el juego"
            );


        }, 500);


    }, 2000);

}

</script>


<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NFC Game Boy</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- Contenedor del emulador -->
    <div id="game"></div>


    <!-- Configuración de EmulatorJS -->
    <script>

        EJS_player = "#game";

        // Núcleo de Game Boy
        EJS_core = "gb";

        // ROM
        EJS_gameUrl = "games/test.gb";

        // Nombre mostrado por el emulador
        EJS_gameName = "NFC Game Boy";

        // NO iniciar inmediatamente
        EJS_startOnLoaded = false;

        // Datos de EmulatorJS
        EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";

    </script>


    <!-- Cargador de EmulatorJS -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>


    <!-- Arranque automático -->
    <script>

        window.addEventListener("load", function () {

            console.log("Página cargada.");

            setTimeout(function () {

                console.log("Intentando iniciar el juego...");

                try {

                    if (
                        typeof EJS !== "undefined" &&
                        typeof EJS_emulator !== "undefined" &&
                        EJS_emulator.gameManager
                    ) {

                        console.log("Emulador encontrado.");

                        EJS_emulator.gameManager.restart();

                    } else {

                        console.log(
                            "El emulador todavía no está listo."
                        );

                    }

                } catch (error) {

                    console.log(
                        "Error al iniciar:",
                        error
                    );

                }

            }, 5000);

        });

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            overflow: hidden;

        }

        #game {

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>


<div id="game"></div>


<script>

    // ==========================================
    // EMULATORJS
    // ==========================================

    window.EJS_player = "#game";

    window.EJS_core = "gb";

    window.EJS_gameUrl = "games/Pokemon_Red.gb";

    window.EJS_gameName = "NFC Game Boy";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    // Arrancar automáticamente
    window.EJS_startOnLoaded = true;

    // ==========================================
    // PRUEBA: SIN AUDIO
    // ==========================================

    window.EJS_volume = 0;

</script>


<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            overflow: hidden;

            font-family:
                Arial,
                sans-serif;

        }


        /* =================================
           PANTALLA DE INICIO
        ================================= */

        #intro {

            position: fixed;

            inset: 0;

            z-index: 999999;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            background:
                #9bbc0f;

            color:
                #0f380f;

            cursor: pointer;

            transition:
                opacity 0.6s ease;

        }


        /* =================================
           GAME BOY
        ================================= */

        .gameboy {

            width: 280px;

            max-width: 75vw;

            padding: 22px;

            background:
                #c6c6a8;

            border-radius:
                18px 18px 35px 18px;

            box-shadow:

                inset 0 0 0 3px
                #8b8b72,

                0 12px 30px
                rgba(0,0,0,.35);

            transform:
                translateY(0);

            animation:
                flotar 2s
                ease-in-out
                infinite;

        }


        @keyframes flotar {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-8px);

            }

        }


        /* =================================
           PANTALLA
        ================================= */

        .screen {

            height: 150px;

            background:
                #8bac0f;

            border:

                7px solid
                #555;

            border-radius:
                8px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-family:
                monospace;

            font-weight:
                bold;

            font-size:
                20px;

            box-shadow:

                inset 0 0 20px
                rgba(0,0,0,.25);

        }


        /* =================================
           CONTROLES
        ================================= */

        .controls {

            margin-top: 20px;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .cross {

            font-size: 55px;

            font-weight:
                bold;

            line-height:
                1;

        }


        .buttons {

            display: flex;

            gap: 12px;

        }


        .round {

            width: 48px;

            height: 48px;

            border-radius:
                50%;

            background:
                #6b2240;

            border:
                3px solid
                #45162b;

            box-shadow:
                0 4px 0
                #45162b;

        }


        /* =================================
           TEXTO
        ================================= */

        .title {

            margin-top:
                25px;

            font-family:
                monospace;

            font-size:
                20px;

            font-weight:
                bold;

            letter-spacing:
                3px;

        }


        .hint {

            margin-top:
                10px;

            font-family:
                monospace;

            font-size:
                13px;

            animation:
                parpadear
                1.2s
                infinite;

        }


        @keyframes parpadear {

            0%,
            100% {

                opacity:
                    1;

            }

            50% {

                opacity:
                    .35;

            }

        }


        /* =================================
           ANIMACIÓN DE SALIDA
        ================================= */

        #intro.saliendo {

            opacity:
                0;

            pointer-events:
                none;

        }


    </style>

</head>


<body>


<!-- =====================================
     INTRO
===================================== -->

<div id="intro">


    <div class="gameboy">


        <div class="screen">

            <div>

                <div>
                    ASTEROIDE B612
                </div>

                <div>
                    GAME BOY
                </div>

                <div>
                    ▶ READY

                </div>

            </div>

        </div>


        <div class="controls">


            <div class="cross">

                ✚

            </div>


            <div class="buttons">

                <div class="round"></div>

                <div class="round"></div>

            </div>


        </div>


    </div>


    <div class="title">

        NFC GAME BOY

    </div>


    <div class="hint">

        TOCA PARA JUGAR

    </div>


</div>


<!-- =====================================
     EMULADOR
===================================== -->

<div id="game"></div>


<script>


    // ====================================
    // CONFIGURACIÓN EMULATORJS
    // ====================================

    window.EJS_player =
        "#game";


    window.EJS_core =
        "gb";


    window.EJS_gameUrl =
        "games/Pokemon_Red.gb";


    window.EJS_gameName =
        "NFC Game Boy";


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";


    window.EJS_startOnLoaded =
        true;



    // ====================================
    // ELEMENTOS
    // ====================================

    const intro =
        document.getElementById(
            "intro"
        );



    // ====================================
    // INICIAR
    // ====================================

    function iniciar() {


        // Evitar dobles pulsaciones

        intro.removeEventListener(
            "click",
            iniciar
        );


        intro.removeEventListener(
            "touchend",
            iniciar
        );


        // Animación de salida

        intro.classList.add(
            "saliendo"
        );


        // Eliminar completamente
        // después de la animación

        setTimeout(

            function () {

                intro.remove();

            },

            700

        );

    }



    // ====================================
    // INTERACCIÓN
    // ====================================

    intro.addEventListener(
        "click",
        iniciar
    );


    intro.addEventListener(
        "touchend",
        function (evento) {

            evento.preventDefault();

            iniciar();

        },
        {
            passive: false
        }
    );


</script>



<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>


</body>

</html>

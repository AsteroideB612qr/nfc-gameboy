<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #diagnostico {

            position: fixed;

            left: 5px;
            right: 5px;

            bottom: 5px;

            z-index: 999999;

            background: rgba(0,0,0,.90);

            color: #00ff66;

            padding: 10px;

            font-family: monospace;

            font-size: 11px;

            max-height: 35vh;

            overflow: auto;

        }

    </style>

</head>


<body>


<div id="game"></div>


<div id="diagnostico">
    Preparando...
</div>


<script>

const D =
    document.getElementById(
        "diagnostico"
    );


function log(texto) {

    D.innerHTML +=
        "<br>" + texto;

    console.log(texto);

}


// ==========================================
// CONFIGURACIÓN
// ==========================================

window.EJS_player =
    "#game";

window.EJS_core =
    "gb";

window.EJS_gameUrl =
    "games/Pokemon_Red.gb";

window.EJS_gameName =
    "NFC Game Boy";

window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";

window.EJS_startOnLoaded =
    true;


// ==========================================
// EJS READY
// ==========================================

window.EJS_ready = function () {

    log(
        "EJS listo"
    );

    buscarReiniciar();

};


// ==========================================
// BUSCAR REINICIAR
// ==========================================

function buscarReiniciar() {

    setTimeout(function () {

        const botones =
            document.querySelectorAll(
                "button"
            );


        let boton =
            null;


        for (
            let i = 0;
            i < botones.length;
            i++
        ) {

            const texto =
                (
                    botones[i].innerText ||
                    ""
                ).trim();


            if (
                texto === "Reiniciar"
            ) {

                boton =
                    botones[i];

                break;

            }

        }


        if (!boton) {

            log(
                "Esperando botón Reiniciar..."
            );

            setTimeout(
                buscarReiniciar,
                500
            );

            return;

        }


        log(
            "✓ Botón Reiniciar encontrado"
        );


        simularToque(
            boton
        );

    }, 2000);

}


// ==========================================
// SIMULAR INTERACCIÓN
// ==========================================

function simularToque(
    elemento
) {

    log(
        "Enviando eventos táctiles..."
    );


    try {

        // ----------------------------------
        // POINTER DOWN
        // ----------------------------------

        elemento.dispatchEvent(

            new PointerEvent(
                "pointerdown",
                {
                    bubbles: true,
                    cancelable: true,
                    pointerId: 1,
                    pointerType: "touch",
                    isPrimary: true,
                    buttons: 1
                }
            )

        );


        // ----------------------------------
        // TOUCH START
        // ----------------------------------

        try {

            elemento.dispatchEvent(

                new TouchEvent(
                    "touchstart",
                    {
                        bubbles: true,
                        cancelable: true
                    }
                )

            );

        }

        catch (e) {

            log(
                "TouchEvent no disponible"
            );

        }


        // ----------------------------------
        // PEQUEÑA PAUSA
        // ----------------------------------

        setTimeout(
            function () {


                // --------------------------
                // POINTER UP
                // --------------------------

                elemento.dispatchEvent(

                    new PointerEvent(
                        "pointerup",
                        {
                            bubbles: true,
                            cancelable: true,
                            pointerId: 1,
                            pointerType: "touch",
                            isPrimary: true,
                            buttons: 0
                        }
                    )

                );


                // --------------------------
                // TOUCH END
                // --------------------------

                try {

                    elemento.dispatchEvent(

                        new TouchEvent(
                            "touchend",
                            {
                                bubbles: true,
                                cancelable: true
                            }
                        )

                    );

                }

                catch (e) {

                    log(
                        "TouchEnd no disponible"
                    );

                }


                // --------------------------
                // CLICK
                // --------------------------

                elemento.click();


                log(
                    "✓ Secuencia enviada"
                );


                log(
                    "¿Arrancó el juego?"
                );


            },
            150
        );

    }

    catch (error) {

        log(
            "❌ Error: " +
            error
        );

    }

}

</script>


<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="game"></div>

    <script>

        // ==========================================
        // EMULATORJS
        // ==========================================

        window.EJS_player = "#game";

        // Game Boy
        window.EJS_core = "gb";

        // ROM
        window.EJS_gameUrl = "games/Pokemon_Red.gb";

        // Nombre del juego
        window.EJS_gameName = "NFC Game Boy";

        // Datos del emulador
        window.EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";

        // Arranque automático
        window.EJS_startOnLoaded = true;


        // ==========================================
        // CUANDO EMULATORJS ESTÉ LISTO
        // ==========================================

        window.EJS_ready = function () {

            console.log("EmulatorJS está listo.");

        };

    </script>


    <script
        src="https://cdn.emulatorjs.org/stable/data/loader.js">
    </script>

</body>
</html>

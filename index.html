<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            overflow: hidden;

        }

        #inicio {

            position: fixed;

            inset: 0;

            z-index: 100000;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                radial-gradient(
                    circle,
                    #303030,
                    #111
                );

        }


        #botonInicio {

            padding: 20px 40px;

            font-size: 22px;

            font-weight: bold;

            color: white;

            background: #1d72f3;

            border: none;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.5);

        }


        #game {

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>


<!-- ======================================
     PANTALLA DE INICIO
====================================== -->

<div id="inicio">

    <button id="botonInicio">

        🎮 INICIAR JUEGO

    </button>

</div>


<!-- ======================================
     EMULADOR
====================================== -->

<div id="game"></div>


<script>

    // ======================================
    // CONFIGURACIÓN EMULATORJS
    // ======================================

    window.EJS_player =
        "#game";

    window.EJS_core =
        "gb";

    window.EJS_gameUrl =
        "games/Pokemon_Red.gb";

    window.EJS_gameName =
        "NFC Game Boy";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;


    // ======================================
    // BOTÓN
    // ======================================

    const boton =
        document.getElementById(
            "botonInicio"
        );


    const pantalla =
        document.getElementById(
            "inicio"
        );


    boton.addEventListener(
        "click",
        function () {

            console.log(
                "INICIAR pulsado"
            );


            // Ocultar pantalla inicial

            pantalla.style.display =
                "none";


        }
    );

</script>


<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            overflow: hidden;

        }

        #game {

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>

    <div id="game"></div>


    <script>

        // ==========================================
        // CONFIGURACIÓN EMULATORJS
        // ==========================================

        window.EJS_player = "#game";

        window.EJS_core = "gb";

        window.EJS_gameUrl = "games/Pokemon_Red.gb";

        window.EJS_gameName = "NFC Game Boy";

        window.EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";

        // Intentar cargar automáticamente
        window.EJS_startOnLoaded = true;


        // ==========================================
        // CUANDO EMULATORJS ESTÉ LISTO
        // ==========================================

        window.EJS_ready = function () {

            console.log(
                "EmulatorJS listo"
            );

            iniciarJuego();

        };


        // ==========================================
        // DESPERTAR EL CORE
        // ==========================================

        function iniciarJuego() {

            console.log(
                "Intentando despertar el juego..."
            );


            // Esperamos un poco para asegurarnos
            // de que el core ya existe.

            setTimeout(function () {

                try {

                    if (
                        window.EJS_emulator &&
                        typeof
                        window.EJS_emulator.pause ===
                        "function"
                    ) {

                        console.log(
                            "Pausando..."
                        );

                        window.EJS_emulator.pause();


                        setTimeout(function () {

                            console.log(
                                "Reanudando..."
                            );

                            if (
                                window.EJS_emulator &&
                                typeof
                                window.EJS_emulator.play ===
                                "function"
                            ) {

                                window.EJS_emulator.play();

                                console.log(
                                    "Juego reanudado."
                                );

                            }

                        }, 100);

                    }

                } catch (error) {

                    console.error(
                        "Error:",
                        error
                    );

                }

            }, 1000);

        }

    </script>


    <script
        src="https://cdn.emulatorjs.org/stable/data/loader.js">
    </script>


</body>

</html>

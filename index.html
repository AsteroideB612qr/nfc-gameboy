<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Game Boy</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            overflow: hidden;

        }

        #game {

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>

<div id="game"></div>


<script>

    // ==========================================
    // EMULATORJS
    // ==========================================

    window.EJS_player = "#game";

    window.EJS_core = "gb";

    window.EJS_gameUrl = "games/Pokemon_Red.gb";

    window.EJS_gameName = "NFC Game Boy";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded = true;


    // ==========================================
    // CUANDO EL EMULADOR ESTÉ LISTO
    // ==========================================

    window.EJS_ready = function () {

        console.log("EJS listo");

        esperarEmulador();

    };


    // ==========================================
    // ESPERAR HASTA QUE EXISTAN LOS OBJETOS
    // ==========================================

    function esperarEmulador() {

        if (
            window.EJS_emulator &&
            window.EJS_emulator.gameManager
        ) {

            console.log(
                "Emulador encontrado"
            );

            despertarJuego();

        } else {

            console.log(
                "Esperando emulador..."
            );

            setTimeout(
                esperarEmulador,
                250
            );

        }

    }


    // ==========================================
    // PAUSA → REANUDAR
    // ==========================================

    function despertarJuego() {

        console.log(
            "Intentando Pausa → Reanudar"
        );


        try {

            // Primero pausamos

            window.EJS_emulator.pause();


            console.log(
                "Pausa ejecutada"
            );


            // Pequeña espera

            setTimeout(function () {

                console.log(
                    "Ejecutando Reanudar"
                );


                /*
                 * Intentamos usar play()
                 */

                if (
                    typeof
                    window.EJS_emulator.play ===
                    "function"
                ) {

                    window.EJS_emulator.play();

                    console.log(
                        "PLAY ejecutado"
                    );

                }

            }, 300);

        }

        catch (error) {

            console.error(
                "Error:",
                error
            );

        }

    }

</script>


<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
</script>


</body>

</html>
